# FINCA·HaTA CX 대시보드 - Netlify 설정
# 빌드 과정 없이 저장소 파일을 그대로 올리는 정적 사이트

[build]
  command = "echo 'Static site - no build needed'"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 화면 파일은 열 때마다 바뀌었는지 확인 (no-cache) → 평범한 새로고침(F5)·로고 클릭만으로 최신 화면
# ("/" 주소도 따로 적어야 첫 화면에 적용됨)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "no-cache"
