<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINCA·HaTA VOC 대시보드</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const VOCDashboard = () => {
      const [activeTab, setActiveTab] = useState('daily');
      const [vocEntries, setVocEntries] = useState([]);
      const [reviews, setReviews] = useState([]);
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState('');

      // Supabase 설정
      const SUPABASE_URL = 'https://kevibkvgledpcyqhlxtl.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_tDSpF5YKm-oRqoLc7BqelQ_4YF_mRwS';

      // API 호출 함수
      const fetchData = async (table) => {
        setLoading(true);
        try {
          const response = await fetch(
            `${SUPABASE_URL}/rest/v1/${table}`,
            {
              headers: {
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
              }
            }
          );
          const data = await response.json();
          return data;
        } catch (error) {
          console.error(`Error fetching ${table}:`, error);
          setMessage(`❌ ${table} 데이터 로드 실패`);
          return [];
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        const loadData = async () => {
          const vocs = await fetchData('voc_entries');
          const revs = await fetchData('reviews');
          const prods = await fetchData('products');
          setVocEntries(vocs || []);
          setReviews(revs || []);
          setProducts(prods || []);
        };
        loadData();
      }, []);

      // 데일리 입력 폼
      const DailyForm = () => {
        const [formData, setFormData] = useState({
          brand: 'FINCA',
          date: new Date().toISOString().split('T')[0],
          platform: '29CM',
          voc_type: '(반품)브랜드과실',
          category_id: '',
          product_name: '',
          quantity: 1,
          notes: ''
        });

        const handleChange = (e) => {
          const { name, value } = e.target;
          setFormData(prev => ({
            ...prev,
            [name]: value
          }));
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          setLoading(true);
          try {
            const response = await fetch(
              `${SUPABASE_URL}/rest/v1/voc_entries`,
              {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${SUPABASE_KEY}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
              }
            );
            if (response.ok) {
              setMessage('✅ VOC 입력 완료!');
              setFormData({
                brand: 'FINCA',
                date: new Date().toISOString().split('T')[0],
                platform: '29CM',
                voc_type: '(반품)브랜드과실',
                category_id: '',
                product_name: '',
                quantity: 1,
                notes: ''
              });
              const updatedVocs = await fetchData('voc_entries');
              setVocEntries(updatedVocs || []);
            }
          } catch (error) {
            setMessage('❌ 저장 실패: ' + error.message);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div style={{ maxWidth: '800px' }}>
            <h2>📝 데일리 VOC 입력</h2>
            <form onSubmit={handleSubmit}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '15px', marginBottom: '20px' }}>
                <div>
                  <label>날짜</label>
                  <input
                    type="date"
                    name="date"
                    value={formData.date}
                    onChange={handleChange}
                    required
                  />
                </div>
                <div>
                  <label>브랜드</label>
                  <select name="brand" value={formData.brand} onChange={handleChange}>
                    <option>FINCA</option>
                    <option>HaTA</option>
                  </select>
                </div>
                <div>
                  <label>플랫폼</label>
                  <select name="platform" value={formData.platform} onChange={handleChange}>
                    <option>29CM</option>
                    <option>자사몰</option>
                    <option>무신사</option>
                    <option>W컨셉</option>
                    <option>EQL</option>
                  </select>
                </div>
                <div>
                  <label>문의유형</label>
                  <select name="voc_type" value={formData.voc_type} onChange={handleChange}>
                    <option>(반품)브랜드과실</option>
                    <option>(교환)브랜드과실</option>
                    <option>기타</option>
                  </select>
                </div>
                <div>
                  <label>수량</label>
                  <input
                    type="number"
                    name="quantity"
                    value={formData.quantity}
                    onChange={handleChange}
                    min="1"
                  />
                </div>
                <div>
                  <label>상품명</label>
                  <input
                    type="text"
                    name="product_name"
                    value={formData.product_name}
                    onChange={handleChange}
                    placeholder="상품명 입력"
                  />
                </div>
              </div>
              <div style={{ marginBottom: '20px' }}>
                <label>비고</label>
                <textarea
                  name="notes"
                  value={formData.notes}
                  onChange={handleChange}
                  placeholder="추가 사항 입력"
                  rows="3"
                />
              </div>
              <button type="submit" style={{ padding: '12px 30px', background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: 'white', border: 'none', borderRadius: '6px', fontSize: '16px', fontWeight: '600', cursor: 'pointer' }} disabled={loading}>
                {loading ? '저장 중...' : '💾 저장'}
              </button>
            </form>
          </div>
        );
      };

      // 리포트 탭
      const ReportTab = () => {
        const totalVocs = vocEntries.length;
        const totalReviews = reviews.length;
        const positiveReviews = reviews.filter(r => r.sentiment === 'positive').length;
        const negativeReviews = reviews.filter(r => r.sentiment === 'negative').length;

        const stats = [
          { label: '총 VOC 건수', value: totalVocs, icon: '📊' },
          { label: '긍정 리뷰', value: positiveReviews, icon: '👍' },
          { label: '부정 리뷰', value: negativeReviews, icon: '👎' },
          { label: '총 리뷰 수', value: totalReviews, icon: '⭐' }
        ];

        return (
          <div>
            <h2>📈 주간/월간 리포트</h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '20px', margin: '30px 0' }}>
              {stats.map((stat, idx) => (
                <div key={idx} style={{ background: 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)', padding: '20px', borderRadius: '12px', textAlign: 'center' }}>
                  <div style={{ fontSize: '32px', marginBottom: '10px' }}>{stat.icon}</div>
                  <div style={{ fontSize: '28px', fontWeight: '700', color: '#667eea', marginBottom: '5px' }}>{stat.value}</div>
                  <div style={{ fontSize: '13px', color: '#666', fontWeight: '500' }}>{stat.label}</div>
                </div>
              ))}
            </div>

            <div style={{ marginTop: '30px' }}>
              <h3>📉 최근 VOC 현황</h3>
              {vocEntries.length > 0 ? (
                <table style={{ width: '100%', marginTop: '20px', borderCollapse: 'collapse' }}>
                  <thead style={{ background: '#f8f9fa', borderBottom: '2px solid #ddd' }}>
                    <tr>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>날짜</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>브랜드</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>플랫폼</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>상품명</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>유형</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>수량</th>
                    </tr>
                  </thead>
                  <tbody>
                    {vocEntries.slice(-10).reverse().map((voc, idx) => (
                      <tr key={idx} style={{ borderBottom: '1px solid #eee' }}>
                        <td style={{ padding: '12px', fontSize: '14px' }}>{new Date(voc.date).toLocaleDateString('ko-KR')}</td>
                        <td style={{ padding: '12px', fontSize: '14px' }}>{voc.brand}</td>
                        <td style={{ padding: '12px', fontSize: '14px' }}>{voc.platform}</td>
                        <td style={{ padding: '12px', fontSize: '14px', fontWeight: '500', color: '#667eea' }}>{voc.product_name}</td>
                        <td style={{ padding: '12px', fontSize: '14px' }}>{voc.voc_type}</td>
                        <td style={{ padding: '12px', fontSize: '14px' }}>{voc.quantity}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              ) : (
                <p>VOC 데이터가 없습니다</p>
              )}
            </div>
          </div>
        );
      };

      // VOC 관리 탭
      const VocTab = () => {
        return (
          <div style={{ maxWidth: '1200px' }}>
            <h2>🎯 VOC 관리</h2>
            
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '20px', margin: '30px 0', marginBottom: '30px' }}>
              <div style={{ background: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', padding: '20px', borderRadius: '12px', borderLeft: '4px solid #ff6b6b' }}>
                <h3 style={{ marginBottom: '10px', color: '#d63031', fontSize: '16px' }}>🎨 상품개선 필요</h3>
                <p style={{ fontSize: '32px', fontWeight: '700', color: '#d63031' }}>{vocEntries.filter(v => v.action_required === '상품개선').length}</p>
              </div>
              <div style={{ background: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', padding: '20px', borderRadius: '12px', borderLeft: '4px solid #ff6b6b' }}>
                <h3 style={{ marginBottom: '10px', color: '#d63031', fontSize: '16px' }}>📦 재입고 필요</h3>
                <p style={{ fontSize: '32px', fontWeight: '700', color: '#d63031' }}>{vocEntries.filter(v => v.action_required === '재입고').length}</p>
              </div>
            </div>

            {vocEntries.length > 0 ? (
              <table style={{ width: '100%', marginTop: '20px', borderCollapse: 'collapse' }}>
                <thead style={{ background: '#f8f9fa', borderBottom: '2px solid #ddd' }}>
                  <tr>
                    <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>날짜</th>
                    <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>상품명</th>
                    <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>브랜드</th>
                    <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>유형</th>
                    <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>상태</th>
                    <th style={{ padding: '12px', textAlign: 'left', fontWeight: '600', color: '#333', fontSize: '14px' }}>액션</th>
                  </tr>
                </thead>
                <tbody>
                  {vocEntries.map((voc, idx) => (
                    <tr key={idx} style={{ borderBottom: '1px solid #eee' }}>
                      <td style={{ padding: '12px', fontSize: '14px' }}>{new Date(voc.date).toLocaleDateString('ko-KR')}</td>
                      <td style={{ padding: '12px', fontSize: '14px', fontWeight: '500', color: '#667eea' }}>{voc.product_name}</td>
                      <td style={{ padding: '12px', fontSize: '14px' }}>{voc.brand}</td>
                      <td style={{ padding: '12px', fontSize: '14px' }}>{voc.voc_type}</td>
                      <td style={{ padding: '12px', fontSize: '14px' }}><span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '20px', fontSize: '12px', fontWeight: '600', background: '#e7f3ff', color: '#0050b3' }}>{voc.status || '접수'}</span></td>
                      <td style={{ padding: '12px', fontSize: '14px', color: '#d4380d', fontWeight: '600' }}>{voc.action_required || '-'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            ) : (
              <p>VOC 데이터가 없습니다</p>
            )}
          </div>
        );
      };

      // 리뷰 분석 탭
      const ReviewTab = () => {
        const positiveCount = reviews.filter(r => r.sentiment === 'positive').length;
        const negativeCount = reviews.filter(r => r.sentiment === 'negative').length;
        const totalCount = reviews.length;
        const positivePercent = totalCount > 0 ? Math.round((positiveCount / totalCount) * 100) : 0;
        const negativePercent = totalCount > 0 ? Math.round((negativeCount / totalCount) * 100) : 0;

        return (
          <div style={{ maxWidth: '1000px' }}>
            <h2>⭐ 리뷰 분석</h2>
            
            <div style={{ background: '#f8f9fa', padding: '25px', borderRadius: '12px', margin: '30px 0' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                  <div style={{ height: '30px', borderRadius: '6px', minWidth: '40px', width: `${positivePercent}%`, background: 'linear-gradient(90deg, #52c41a 0%, #85ce61 100%)' }}></div>
                  <span style={{ fontWeight: '600', fontSize: '14px' }}>긍정: {positiveCount}건 ({positivePercent}%)</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                  <div style={{ height: '30px', borderRadius: '6px', minWidth: '40px', width: `${negativePercent}%`, background: 'linear-gradient(90deg, #ff4d4f 0%, #ff7875 100%)' }}></div>
                  <span style={{ fontWeight: '600', fontSize: '14px' }}>부정: {negativeCount}건 ({negativePercent}%)</span>
                </div>
              </div>
            </div>

            <div style={{ margin: '30px 0' }}>
              <h3>🔍 주요 코멘트 키워드</h3>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', marginTop: '15px' }}>
                {['품질 우수', '배송 빠름', '색상 이염', '박음질 불량', '디자인 만족', '가격대비 좋음', '물빠짐', '사이즈 작음'].map((keyword, idx) => (
                  <span key={idx} style={{ display: 'inline-block', padding: '8px 16px', background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: 'white', borderRadius: '20px', fontSize: '13px', fontWeight: '500' }}>{keyword}</span>
                ))}
              </div>
            </div>

            {reviews.length > 0 && (
              <div style={{ marginTop: '30px' }}>
                <h3>📝 최근 리뷰</h3>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '15px', marginTop: '20px' }}>
                  {reviews.slice(-6).map((review, idx) => (
                    <div key={idx} style={{ background: review.sentiment === 'positive' ? '#f6ffed' : '#fff1f0', padding: '15px', borderRadius: '8px', borderLeft: `4px solid ${review.sentiment === 'positive' ? '#52c41a' : '#ff4d4f'}` }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                        <span style={{ fontSize: '20px' }}>{review.sentiment === 'positive' ? '👍' : '👎'}</span>
                        <span style={{ fontWeight: '600', color: '#667eea', fontSize: '14px' }}>★{review.rating}/5</span>
                      </div>
                      <p style={{ fontWeight: '600', color: '#333', marginBottom: '8px', fontSize: '14px' }}>{review.product_name}</p>
                      <p style={{ color: '#666', fontSize: '13px', lineHeight: '1.5', marginBottom: '10px' }}>{review.content?.substring(0, 80)}...</p>
                      <p style={{ color: '#999', fontSize: '12px' }}>{new Date(review.created_at).toLocaleDateString('ko-KR')}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      };

      // 공개 뷰
      const PublicViewTab = () => {
        const totalVocs = vocEntries.length;
        const positiveReviews = reviews.filter(r => r.sentiment === 'positive').length;
        const negativeReviews = reviews.filter(r => r.sentiment === 'negative').length;
        const totalReviews = reviews.length;

        return (
          <div style={{ maxWidth: '1000px' }}>
            <h2>🌐 전사 공개 뷰</h2>
            <div style={{ background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: 'white', padding: '20px', borderRadius: '8px', margin: '20px 0', textAlign: 'center' }}>
              <p>👥 전사원이 조회 가능한 VOC 및 리뷰 분석 대시보드</p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '20px', margin: '30px 0' }}>
              <div style={{ background: 'white', border: '2px solid #e0e0e0', padding: '25px', borderRadius: '12px', textAlign: 'center' }}>
                <h3 style={{ fontSize: '16px', color: '#666', marginBottom: '15px' }}>📊 이번 주 VOC 현황</h3>
                <div style={{ fontSize: '48px', fontWeight: '700', color: '#667eea', margin: '15px 0' }}>{totalVocs}</div>
                <p style={{ color: '#999', fontSize: '14px' }}>총 VOC 건수</p>
              </div>
              <div style={{ background: 'white', border: '2px solid #e0e0e0', padding: '25px', borderRadius: '12px', textAlign: 'center' }}>
                <h3 style={{ fontSize: '16px', color: '#666', marginBottom: '15px' }}>⭐ 고객 만족도</h3>
                <div style={{ fontSize: '48px', fontWeight: '700', color: '#667eea', margin: '15px 0' }}>{totalReviews > 0 ? Math.round((positiveReviews / totalReviews) * 100) : 0}%</div>
                <p style={{ color: '#999', fontSize: '14px' }}>긍정 리뷰 비율</p>
              </div>
              <div style={{ background: 'white', border: '2px solid #e0e0e0', padding: '25px', borderRadius: '12px', textAlign: 'center' }}>
                <h3 style={{ fontSize: '16px', color: '#666', marginBottom: '15px' }}>🎯 액션 아이템</h3>
                <div style={{ fontSize: '48px', fontWeight: '700', color: '#667eea', margin: '15px 0' }}>{vocEntries.filter(v => v.action_required).length}</div>
                <p style={{ color: '#999', fontSize: '14px' }}>개선 필요 건수</p>
              </div>
            </div>

            <div style={{ background: '#f0f5ff', padding: '25px', borderRadius: '12px', borderLeft: '4px solid #667eea', marginTop: '30px' }}>
              <h3 style={{ marginBottom: '15px', color: '#333' }}>💡 주요 인사이트</h3>
              <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: '10px' }}>
                <li style={{ color: '#333', fontSize: '14px', lineHeight: '1.6' }}>🔴 긴급: 박음질 불량 {vocEntries.filter(v => v.voc_type?.includes('박음')).length}건</li>
                <li style={{ color: '#333', fontSize: '14px', lineHeight: '1.6' }}>🟡 주의: 이염/물빠짐 {vocEntries.filter(v => v.voc_type?.includes('이염')).length}건</li>
                <li style={{ color: '#333', fontSize: '14px', lineHeight: '1.6' }}>🟢 긍정: 디자인 만족도 {positiveReviews}건</li>
                <li style={{ color: '#333', fontSize: '14px', lineHeight: '1.6' }}>📈 이번 주 평가 평균: {reviews.length > 0 ? (reviews.reduce((sum, r) => sum + (r.rating || 0), 0) / reviews.length).toFixed(1) : 0}점</li>
              </ul>
            </div>
          </div>
        );
      };

      return (
        <div style={{ maxWidth: '1400px', margin: '0 auto', padding: '20px' }}>
          <header style={{ background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: 'white', padding: '40px 30px', borderRadius: '12px', marginBottom: '30px', boxShadow: '0 4px 15px rgba(102, 126, 234, 0.3)' }}>
            <h1 style={{ fontSize: '32px', marginBottom: '10px' }}>🎯 FINCA·HaTA VOC 대시보드</h1>
            <p style={{ fontSize: '16px', opacity: '0.95' }}>실시간 고객의 목소리(VOC) 및 리뷰 관리 시스템</p>
          </header>

          {message && (
            <div style={{ padding: '15px 20px', borderRadius: '8px', marginBottom: '20px', fontWeight: '500', background: message.includes('✅') ? '#d4edda' : '#f8d7da', color: message.includes('✅') ? '#155724' : '#721c24', borderLeft: `4px solid ${message.includes('✅') ? '#28a745' : '#f5222d'}` }}>
              {message}
            </div>
          )}

          <div style={{ marginBottom: '30px', overflowX: 'auto' }}>
            <div style={{ display: 'flex', gap: '10px', borderBottom: '2px solid #e0e0e0', paddingBottom: '10px' }}>
              {[
                { id: 'daily', label: '📝 데일리 입력' },
                { id: 'report', label: '📈 리포트' },
                { id: 'voc', label: '🎯 VOC 관리' },
                { id: 'review', label: '⭐ 리뷰 분석' },
                { id: 'public', label: '🌐 공개 뷰' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  style={{
                    padding: '12px 24px',
                    background: activeTab === tab.id ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : 'white',
                    border: activeTab === tab.id ? 'none' : 'none',
                    cursor: 'pointer',
                    fontSize: '15px',
                    fontWeight: '500',
                    color: activeTab === tab.id ? 'white' : '#666',
                    borderRadius: '8px 8px 0 0',
                    transition: 'all 0.3s ease',
                    whiteSpace: 'nowrap'
                  }}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </div>

          <div style={{ background: 'white', borderRadius: '12px', padding: '30px', boxShadow: '0 2px 8px rgba(0, 0, 0, 0.1)' }}>
            {activeTab === 'daily' && <DailyForm />}
            {activeTab === 'report' && <ReportTab />}
            {activeTab === 'voc' && <VocTab />}
            {activeTab === 'review' && <ReviewTab />}
            {activeTab === 'public' && <PublicViewTab />}
          </div>

          {loading && (
            <div style={{ position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', background: 'rgba(0, 0, 0, 0.7)', color: 'white', padding: '20px 40px', borderRadius: '8px', fontWeight: '600', zIndex: 1000 }}>
              로딩 중...
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<VOCDashboard />);
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
      color: #333;
      line-height: 1.6;
    }

    input, select, textarea {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
      display: block;
    }
  </style>
</body>
</html>
